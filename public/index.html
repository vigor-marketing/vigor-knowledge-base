<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>企业知识库</title><link rel="stylesheet" href="styles.css"/></head><body><main class="shell"><aside class="sidebar"><div class="brand">▦ 企业知识库</div><nav><button class="nav active" data-panel="search">⌕ 资料查询</button><button class="nav" data-panel="manage">↑ 资料管理</button><button class="nav" data-panel="downloads">⇩ 资料下载</button></nav><p class="side-note">需要什么资料，随时回来找</p></aside><section class="content"><header><p>VIGOR / KNOWLEDGE BASE</p><h1 id="page-title">资料查询</h1></header><section id="search" class="panel active"><h2>快速找到你需要的资料</h2><form id="search-form"><input id="search-query" placeholder="例如：P110 产品的最大工作压力" required/><button>搜索资料</button></form><div id="search-state">输入关键词开始查找；找到后可直接下载。</div><div id="search-results"></div></section><section id="manage" class="panel"><h2>资料管理</h2><p>把资料放到对应分类；更新时会保留每一次修改记录。</p></section><section id="downloads" class="panel"><h2>资料下载</h2><p>按分类下载资料。用完后，也欢迎留下评价或建议。</p></section></section></main><script type="module" src="app.js"></script></body></html>
