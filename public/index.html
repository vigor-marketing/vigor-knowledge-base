<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="robots" content="noindex"/><title>企业知识库</title><link rel="stylesheet" href="styles.css"/></head><body><main class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">▦</span><span>企业知识库</span></div><nav aria-label="知识库菜单"><button class="nav active" data-panel="search"><b>⌕</b>资料查询</button><button class="nav" data-panel="manage"><b>↑</b>资料管理</button><button class="nav" data-panel="downloads"><b>⇩</b>资料下载</button></nav><p class="side-note">需要什么资料，随时回来找</p></aside><section class="content"><header><p class="eyebrow">VIGOR / KNOWLEDGE BASE</p><h1 id="page-title">资料查询</h1><p id="service-status" class="status">正在准备资料库</p></header><section id="search" class="panel active"><h2>快速找到你需要的资料</h2><form id="search-form" class="search-form"><input id="search-query" type="search" maxlength="500" placeholder="例如：P110 产品的最大工作压力" required/><button>搜索资料</button></form><div id="search-state" class="empty"><h3>输入关键词开始查找</h3><p>找到后可直接下载，也能看到资料所在分类。</p></div><div id="search-results" class="list" hidden></div></section><section id="manage" class="panel"><h2>资料管理</h2><p>把资料放到对应分类；更新时会保留每一次修改记录。</p><form id="upload-form" class="form"><label>资料标题<input name="title" required/></label><label>资料分类<select name="documentType"><option value="PRODUCT">产品资料</option><option value="TECHNICAL">技术资料</option><option value="SOP">SOP / 制度</option></select></label><label>文件<input name="file" type="file" accept=".pdf,.docx,.xlsx,.pptx,.txt,.md" required/></label><button>上传资料</button><p id="upload-state" role="status"></p></form></section><section id="downloads" class="panel"><h2>资料下载</h2><p>按分类下载已发布资料。用完后，也欢迎留下评价或建议。</p><div class="filters"><button class="filter active">全部资料</button><button class="filter">产品资料</button><button class="filter">技术资料</button><button class="filter">SOP / 制度</button></div><div id="download-list" class="download-list"><article class="empty"><h3>这里还没有资料</h3><p>资料发布后会按分类展示，并标明最新版本和更新时间。</p></article></div></section></section></main><script type="module" src="app.js"></script></body></html>
